name: Build TWRP for MOA-LX9N

on:
  workflow_dispatch:
  push:
    paths:
      - 'device/**'
      - '.github/workflows/**'

env:
  DEVICE_TREE_PATH: device/huawei/MOA_LX9N
  BUILD_TARGET: omni_MOA_LX9N-eng
  TWRP_BRANCH: twrp-9.0

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift || true
          docker rmi $(docker images -aq) 2>/dev/null || true
          df -h

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip \
            curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5 \
            lib32ncurses-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev \
            libxml2-utils xsltproc unzip fontconfig python3 ccache bc \
            python2 libpython2-stdlib libtinfo5 \
            libssl-dev lz4 libncurses-dev gperf pngcrush schedtool \
            rsync repo && \
          (sudo ln -sf /usr/bin/python2 /usr/bin/python || true)

      - name: Checkout this repo (device tree)
        uses: actions/checkout@v4

      - name: Setup ccache
        run: |
          sudo mkdir -p /opt/ccache
          sudo chown $USER:$USER /opt/ccache
          echo "CCACHE_DIR=/opt/ccache" >> $GITHUB_ENV
          echo "USE_CCACHE=1" >> $GITHUB_ENV
          /usr/bin/ccache -M 10G || true

      - name: Cache TWRP source + ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/twrp/.repo
            ~/twrp/bootable
            ~/twrp/build
            ~/twrp/external
            ~/twrp/frameworks
            ~/twrp/system
            ~/twrp/vendor
            /opt/ccache
          key: twrp-src-${{ env.TWRP_BRANCH }}-v1

      - name: Sync minimal TWRP manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_omni.git -b ${{ env.TWRP_BRANCH }} --depth=1
          repo sync -c -j$(nproc --all) --no-tags --no-clone-bundle

      - name: Copy device tree into source
        run: |
          mkdir -p ~/twrp/${{ env.DEVICE_TREE_PATH }}
          cp -r ${{ github.workspace }}/${{ env.DEVICE_TREE_PATH }}/. ~/twrp/${{ env.DEVICE_TREE_PATH }}/

      - name: Build recovery image
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch ${{ env.BUILD_TARGET }}
          mka recoveryimage -j$(nproc --all)

      - name: Repack into Huawei split-recovery images
        run: |
          cd ${{ github.workspace }}
          OUT=~/twrp/out/target/product/MOA_LX9N
          mkdir -p repack
          bash tools/unpack_img.sh $OUT/recovery.img repack
          R=repack/ramdisk.cpio.gz; [ -f "$R" ] || R=repack/ramdisk.cpio.bin
          # 1) TWRP ramdisk -> recovery_ramdisk partition.
          #    Format matches a known-working image byte-for-byte (header v0,
          #    ramdisk-only, base 0x10000000).
          perl tools/pack_ramdisk_img.pl twrp-ramdisk-MOA-LX9N.img "$R" \
            "buildvariant=eng" 0x10000000 2048 0x1000000 0x100
          # 2) stock kernel+dtb -> recovery partition (cmdline: permissive,
          #    androidboot.hardware=mt6765), header v2 like stock.
          perl tools/repack_img.pl recovery-kernel-MOA-LX9N.img \
            ${{ env.DEVICE_TREE_PATH }}/prebuilt/Image.gz \
            ${{ env.DEVICE_TREE_PATH }}/prebuilt/stub-ramdisk.cpio.gz \
            ${{ env.DEVICE_TREE_PATH }}/prebuilt/dtb.img \
            "bootopt=64S3,32N2,64N2 androidboot.selinux=permissive androidboot.hardware=mt6765 unmovable_isolate1=2:256M,3:312M,4:348M buildvariant=user" \
            0x40078000 2048 0x8000 0x11a88000 0xf88000 0x7808000 0x7808000
          ls -la twrp-ramdisk-MOA-LX9N.img recovery-kernel-MOA-LX9N.img

      - name: Upload recovery images
        uses: actions/upload-artifact@v4
        with:
          name: twrp-MOA-LX9N
          path: |
            twrp-ramdisk-MOA-LX9N.img
            recovery-kernel-MOA-LX9N.img
            ~/twrp/out/target/product/MOA_LX9N/recovery.img
